# Bumps the app version (.homeycompose/app.json + .homeychangelog.json),
# rebuilds the generated app.json and commits the result to the branch.
# Run manually from the Actions tab, then run "Publish" when you're ready to
# ship the new version to the App Store.
name: Update Version

on:
  workflow_dispatch:
    inputs:
      version:
        type: choice
        description: Version bump
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      changelog:
        type: string
        description: Changelog (English)
        required: true

permissions:
  contents: write

jobs:
  update-version:
    name: Update Homey App Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Update Homey App Version
        uses: athombv/github-action-homey-app-version@master
        id: update_version
        with:
          version: ${{ inputs.version }}
          changelog: ${{ inputs.changelog }}

      - name: Rebuild manifest (.homeycompose -> app.json)
        run: npm run build:manifest

      - name: Commit & Push
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Homey App Version to v${{ steps.update_version.outputs.version }}"
          git push origin HEAD
