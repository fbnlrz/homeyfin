name: Publish

# One-click publish to the Homey App Store. Run it from the Actions tab
# (Run workflow) on the branch you want to publish. It publishes the version
# currently committed in that branch — so bump the version + changelog in the
# repo first (.homeycompose/app.json + .homeychangelog.json, then
# `npm run build:manifest`, then commit).
#
# Requires a repository secret HOMEY_PAT — a Personal Access Token from
# https://tools.developer.homey.app/me (Settings → Secrets and variables →
# Actions → New repository secret).

on:
  workflow_dispatch:

jobs:
  publish:
    name: Publish to the Homey App Store
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish
        id: publish
        uses: athombv/github-action-homey-app-publish@master
        with:
          personal_access_token: ${{ secrets.HOMEY_PAT }}

      - name: Summary
        run: echo "✅ Published. Manage the build at ${{ steps.publish.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
