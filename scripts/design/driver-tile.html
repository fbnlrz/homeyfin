<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  /* Store guideline 1.4.3: driver image on a WHITE background. */
  html { background: #ffffff; }
  body { position: fixed; inset: 0; background: #ffffff; display: grid; place-items: center; }

  .emblem {
    position: relative;
    width: 62vw; height: 62vw; border-radius: 16vw;
    background: linear-gradient(135deg, #aa5cc3, #00a4dc);
    display: grid; place-items: center;
    box-shadow: 0 5vw 10vw rgba(20, 40, 70, 0.28), inset 0 1.6vw 3.5vw rgba(255,255,255,0.28), inset 0 -1.8vw 4vw rgba(0,0,0,0.18);
  }
  .emblem svg { width: 30vw; height: 30vw; fill: #ffffff; filter: drop-shadow(0 1vw 2vw rgba(0,0,0,0.28)); }

  /* small status dot to hint "live service" — differs per glyph via JS */
  .dot {
    position: absolute; right: 6vw; bottom: 6vw;
    width: 10vw; height: 10vw; border-radius: 50%;
    background: #2ecc71; border: 1.6vw solid #ffffff;
    box-shadow: 0 1vw 2.5vw rgba(0,0,0,0.22);
  }
</style>
</head>
<body>
  <div class="emblem" id="emblem">
    <span id="glyph"></span>
    <div class="dot" id="dot"></div>
  </div>
  <script>
    const glyphs = {
      server: '<svg viewBox="0 0 100 100"><path fill-rule="evenodd" d="M16 22 H84 V46 H16 Z M26 30 H40 V38 H26 Z M16 54 H84 V78 H16 Z M26 62 H40 V70 H26 Z"/></svg>',
      user: '<svg viewBox="0 0 100 100"><path d="M50 20 A16 16 0 1 0 50 52 A16 16 0 1 0 50 20 Z M20 84 C20 66 33 56 50 56 C67 56 80 66 80 84 Z"/></svg>'
    };
    const which = (location.search.match(/glyph=(\w+)/) || [,'server'])[1];
    document.getElementById('glyph').innerHTML = glyphs[which] || glyphs.server;
    // user tile: play-state dot in Jellyfin cyan instead of green
    if (which === 'user') document.getElementById('dot').style.background = '#00a4dc';
  </script>
</body>
</html>
