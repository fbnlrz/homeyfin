<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="root" class="card">
    <header class="card-header">
      <div class="tabs">
        <button class="tab active" id="tab-latest">New</button>
        <button class="tab" id="tab-resume">Continue</button>
      </div>
      <select id="server-select" class="server-select hidden" title="Server"></select>
    </header>

    <div class="empty-msg hidden" id="empty-msg">—</div>

    <div class="grid" id="grid"></div>

    <div class="sheet hidden" id="sheet">
      <div class="sheet-backdrop" id="sheet-backdrop"></div>
      <div class="sheet-panel">
        <div class="sheet-title" id="sheet-title">—</div>
        <div class="sheet-list" id="sheet-list"></div>
      </div>
    </div>
  </div>
  <script src="./script.js"></script>
</body>
</html>
