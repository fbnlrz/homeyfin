<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    .auth-toggle { display: flex; gap: 8px; margin-bottom: 12px; }
    .auth-toggle button {
      flex: 1; padding: 8px 4px; font-size: 13px; cursor: pointer;
      border: 1px solid #ccc; border-radius: 6px; background: #fff; color: #333;
    }
    .auth-toggle button.active { border-color: #06c; color: #06c; font-weight: 600; }
    #qc-code {
      font-size: 34px; font-weight: 700; letter-spacing: 6px; text-align: center;
      margin: 12px 0 4px; font-family: monospace;
    }
    #qc-instruction { text-align: center; font-size: 12px; color: #555; margin: 0 0 8px; }
    .subtle-note { font-size: 11px; color: #888; margin-top: 8px; }
  </style>
</head>
<body>
  <header class="homey-header">
    <h1 class="homey-title">Connect to Jellyfin</h1>
    <p class="homey-subtitle" id="subtitle">Enter your server URL and API key.</p>
  </header>

  <div class="auth-toggle">
    <button id="mode-apikey" type="button" class="active">API key</button>
    <button id="mode-qc" type="button">Quick Connect</button>
  </div>

  <fieldset class="homey-form-fieldset">
    <div class="homey-form-group">
      <label class="homey-form-label" for="baseUrl">Server URL</label>
      <input class="homey-form-input" id="baseUrl" type="url"
             placeholder="http://192.168.1.10:8096" autocomplete="off" />
      <p class="homey-form-helper-text">Include scheme and port, e.g. http://host:8096</p>
    </div>

    <div id="apikey-group" class="homey-form-group">
      <label class="homey-form-label" for="apiKey">API Key</label>
      <input class="homey-form-input" id="apiKey" type="password" autocomplete="off" />
      <p class="homey-form-helper-text">Jellyfin: Dashboard → API Keys → New</p>
    </div>

    <div id="qc-group" style="display:none;">
      <div class="homey-form-group">
        <label class="homey-form-checkbox">
          <input type="checkbox" id="qcInsecureTls" class="homey-form-checkbox-input" />
          <span class="homey-form-checkbox-checkmark"></span>
          <span class="homey-form-checkbox-text">Allow self-signed HTTPS</span>
        </label>
      </div>
      <div id="qc-code-box" style="display:none;">
        <div id="qc-code"></div>
        <p id="qc-instruction"></p>
      </div>
      <p class="subtle-note" id="qc-admin-note"></p>
    </div>

    <div id="user-group" class="homey-form-group" style="display:none;">
      <label class="homey-form-label" for="userSelect">Default user</label>
      <select class="homey-form-select" id="userSelect"></select>
      <p class="homey-form-helper-text">Library counts and "latest items" come from this user.</p>
    </div>

    <div id="error" style="color:#c00;margin-top:8px;white-space:pre-wrap;font-size:12px;"></div>
    <div id="info"  style="color:#06c;margin-top:8px;font-size:12px;"></div>
  </fieldset>

  <button id="action" class="homey-button-primary-full">Test connection</button>

  <script type="application/javascript">
    const $err = document.getElementById('error');
    const $info = document.getElementById('info');
    const $btn = document.getElementById('action');
    const $sel = document.getElementById('userSelect');
    const $userGroup = document.getElementById('user-group');
    const $apikeyGroup = document.getElementById('apikey-group');
    const $qcGroup = document.getElementById('qc-group');
    const $qcCodeBox = document.getElementById('qc-code-box');
    const $qcCode = document.getElementById('qc-code');
    const $modeApikey = document.getElementById('mode-apikey');
    const $modeQc = document.getElementById('mode-qc');

    // Tiny inline i18n (en/de/nl) — pairing views have no locale files.
    const LANG = ((navigator.language || 'en').toLowerCase().slice(0, 2));
    function t(key) {
      const strings = {
        qc_instruction: {
          en: 'Enter this code in your Jellyfin app under Settings → Quick Connect.',
          de: 'Diesen Code in deiner Jellyfin-App unter Einstellungen → Quick Connect eingeben.',
          nl: 'Voer deze code in je Jellyfin-app in onder Instellingen → Quick Connect.',
        },
        qc_admin_note: {
          en: 'Note: server admin actions (restart/shutdown, disabling users) require signing in with an admin account.',
          de: 'Hinweis: Server-Admin-Aktionen (Neustart/Herunterfahren, Benutzer sperren) erfordern die Anmeldung mit einem Admin-Konto.',
          nl: 'Let op: serverbeheeracties (herstarten/afsluiten, gebruikers uitschakelen) vereisen aanmelding met een beheerdersaccount.',
        },
        qc_waiting: {
          en: 'Waiting for approval…',
          de: 'Warte auf Bestätigung…',
          nl: 'Wachten op goedkeuring…',
        },
        qc_expired: {
          en: 'Code expired — request a new one.',
          de: 'Code abgelaufen — fordere einen neuen an.',
          nl: 'Code verlopen — vraag een nieuwe aan.',
        },
      };
      const entry = strings[key] || {};
      return entry[LANG] || entry.en || '';
    }
    document.getElementById('qc-admin-note').textContent = t('qc_admin_note');
    document.getElementById('qc-instruction').textContent = t('qc_instruction');

    const QC_POLL_MS = 2500;
    const QC_TIMEOUT_MS = 5 * 60 * 1000;

    let mode = 'apikey';        // 'apikey' | 'qc'
    let users = null;           // set => next click finalizes
    let creds = null;           // API-key path credentials for finalize
    let qc = null;              // { secret, timer, deadline, inFlight }

    function isRepair() {
      try { return typeof Homey.createDevice !== 'function'; } catch { return true; }
    }

    function clearMessages() {
      $err.textContent = '';
      $info.textContent = '';
    }

    function stopQcPolling() {
      if (qc && qc.timer) clearInterval(qc.timer);
      qc = null;
    }

    function resetFlowState() {
      stopQcPolling();
      users = null;
      creds = null;
      $userGroup.style.display = 'none';
      $qcCodeBox.style.display = 'none';
      $sel.innerHTML = '';
      clearMessages();
    }

    function setMode(next) {
      if (mode === next) return;
      mode = next;
      resetFlowState();
      $modeApikey.classList.toggle('active', mode === 'apikey');
      $modeQc.classList.toggle('active', mode === 'qc');
      $apikeyGroup.style.display = mode === 'apikey' ? '' : 'none';
      $qcGroup.style.display = mode === 'qc' ? '' : 'none';
      document.getElementById('subtitle').textContent = mode === 'qc'
        ? 'Enter your server URL, then approve the code in Jellyfin.'
        : 'Enter your server URL and API key.';
      $btn.textContent = mode === 'qc' ? 'Get code' : 'Test connection';
      $btn.disabled = false;
    }

    function showUsers(list, preselectId) {
      users = list;
      $sel.innerHTML = '';
      for (const u of list) {
        const opt = document.createElement('option');
        opt.value = u.Id;
        opt.textContent = u.Name + (u.IsAdministrator ? ' (admin)' : '');
        if (preselectId && u.Id === preselectId) opt.selected = true;
        $sel.appendChild(opt);
      }
      $userGroup.style.display = '';
      $btn.textContent = 'Add device';
      $btn.disabled = false;
    }

    // --- API-key path (unchanged behavior) ---

    async function test() {
      clearMessages();
      $btn.disabled = true;

      const baseUrl = document.getElementById('baseUrl').value.trim();
      const apiKey  = document.getElementById('apiKey').value.trim();
      if (!baseUrl || !apiKey) {
        $err.textContent = 'URL and API key are required.';
        $btn.disabled = false;
        return;
      }

      try {
        $info.textContent = 'Testing connection…';
        const result = await Homey.emit('verify_connection', { baseUrl, apiKey });
        if (!result || !Array.isArray(result.users)) {
          throw new Error('Verify returned no users: ' + JSON.stringify(result));
        }
        creds = { baseUrl, apiKey };
        showUsers(result.users);
        $info.textContent = 'Connected to ' + result.server + ' — pick a default user.';
      } catch (e) {
        $info.textContent = '';
        $err.textContent = (e && (e.message || e.toString())) || 'Unknown error';
        $btn.disabled = false;
      }
    }

    // --- Quick Connect path ---

    async function qcStart() {
      clearMessages();
      $btn.disabled = true;

      const baseUrl = document.getElementById('baseUrl').value.trim();
      if (!baseUrl) {
        $err.textContent = 'Server URL is required.';
        $btn.disabled = false;
        return;
      }
      const insecureTls = document.getElementById('qcInsecureTls').checked;

      try {
        $info.textContent = 'Contacting server…';
        const res = await Homey.emit('qc_start', { baseUrl, insecureTls });
        if (!res || !res.code || !res.secret) {
          throw new Error('Quick Connect returned no code');
        }
        $qcCode.textContent = res.code;
        $qcCodeBox.style.display = '';
        $info.textContent = t('qc_waiting');
        qc = {
          secret: res.secret,
          deadline: Date.now() + QC_TIMEOUT_MS,
          inFlight: false,
          timer: null,
        };
        qc.timer = setInterval(qcPollTick, QC_POLL_MS);
        $btn.textContent = 'Cancel';
        $btn.disabled = false;
      } catch (e) {
        $info.textContent = '';
        $err.textContent = (e && (e.message || e.toString())) || 'Unknown error';
        $btn.textContent = 'Get code';
        $btn.disabled = false;
      }
    }

    function qcCancel(message) {
      stopQcPolling();
      $qcCodeBox.style.display = 'none';
      clearMessages();
      if (message) $err.textContent = message;
      $btn.textContent = 'Get code';
      $btn.disabled = false;
    }

    async function qcPollTick() {
      if (!qc || qc.inFlight) return;
      if (Date.now() > qc.deadline) {
        qcCancel(t('qc_expired'));
        return;
      }
      qc.inFlight = true;
      const secret = qc.secret;
      try {
        const res = await Homey.emit('qc_poll', { secret });
        if (!qc || qc.secret !== secret) return; // cancelled/restarted meanwhile
        if (!res || res.authenticated !== true) {
          qc.inFlight = false;
          return;
        }
        stopQcPolling();
        $qcCodeBox.style.display = 'none';
        showUsers(res.users || [], res.authUserId);
        $info.textContent = 'Connected to ' + res.server + ' — pick a default user.';
      } catch (e) {
        if (!qc || qc.secret !== secret) return;
        qcCancel((e && (e.message || e.toString())) || 'Unknown error');
      }
    }

    // --- Finalize (shared; QC relies on the session state set by qc_poll) ---

    async function finalize() {
      clearMessages();
      $btn.disabled = true;
      try {
        const userId = $sel.value;
        if (!userId) throw new Error('Pick a user');
        const payload = { userId };
        if (mode === 'apikey' && creds) {
          payload.baseUrl = creds.baseUrl;
          payload.apiKey = creds.apiKey;
        }
        const device = await Homey.emit('finalize', payload);
        if (!device) throw new Error('Finalize returned no device');

        if (isRepair()) {
          $info.textContent = 'Saved. Closing…';
          await Homey.done();
          return;
        }
        $info.textContent = 'Creating device…';
        await Homey.createDevice(device);
        await Homey.done();
      } catch (e) {
        $info.textContent = '';
        $err.textContent = (e && (e.message || e.toString())) || 'Unknown error';
        $btn.disabled = false;
      }
    }

    $modeApikey.addEventListener('click', () => setMode('apikey'));
    $modeQc.addEventListener('click', () => setMode('qc'));

    $btn.addEventListener('click', () => {
      if (users !== null) { finalize(); return; }
      if (mode === 'apikey') { test(); return; }
      if (qc) { qcCancel(); return; }
      qcStart();
    });
  </script>
</body>
</html>
